<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PetFinder – Έλεγχος αναφοράς</title>
<style>
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #F6F4EF; color: #1F2A24; padding: 16px; }
  .card { background: #fff; border-radius: 18px; padding: 24px; max-width: 560px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { color: #2F6F4F; font-size: 22px; margin: 0 0 12px; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .photos img { width: 160px; height: 160px; object-fit: cover; border-radius: 12px; background: #eee; }
  .row { margin: 6px 0; line-height: 1.5; }
  .muted { color: #6B7570; font-size: 13px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .hidden { background: #FDE8E8; color: #B91C1C; }
  .open { background: #E3F1E8; color: #2F6F4F; }
  .buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { flex: 1; min-width: 180px; font-size: 16px; font-weight: 700; padding: 14px; border-radius: 12px; border: 0; cursor: pointer; }
  .approve { background: #2F6F4F; color: #fff; }
  .reject { background: #fff; color: #B91C1C; border: 1.5px solid #B91C1C; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <h1>Έλεγχος αναφοράς</h1>
  <div id="content" class="muted">Φόρτωση…</div>
</div>
<script>
  // Σελίδα για τον διαχειριστή: ανοίγει από το email ελέγχου.
  // Το link περιέχει το id της αναφοράς και μια υπογραφή· χωρίς αυτά δεν εμφανίζεται τίποτα.
  var API = 'https://zlcnhjdruwmuptzwtxbg.supabase.co/functions/v1/review-report';
  var q = new URLSearchParams(location.search);
  var id = q.get('id'), sig = q.get('sig');
  var box = document.getElementById('content');
  var SPECIES = { dog: 'Σκύλος', cat: 'Γάτα', other: 'Άλλο' };
  var REASON = { inappropriate: 'Ακατάλληλη φωτογραφία', not_animal: 'Δεν δείχνει ζώο', ok: 'Εντάξει' };

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(r) {
    var hidden = r.hidden_by_moderation;
    var photos = (r.photos || []).map(function (u) { return '<a href="' + esc(u) + '" target="_blank"><img src="' + esc(u) + '"></a>'; }).join('');
    box.className = '';
    box.innerHTML =
      '<div class="row"><span class="badge ' + (hidden ? 'hidden' : 'open') + '">' + (hidden ? 'Κρυφή' : 'Δημοσιευμένη') + '</span></div>' +
      '<div class="row"><strong>Αυτόματος έλεγχος:</strong> ' + esc(REASON[r.moderation] || '—') + '</div>' +
      (r.moderation_reason ? '<div class="row"><strong>Σχόλιο AI:</strong> ' + esc(r.moderation_reason) + '</div>' : '') +
      '<div class="row"><strong>Αναφορά:</strong> ' + (r.type === 'lost' ? 'Χαμένο' : 'Αδέσποτο') + ' · ' + esc(SPECIES[r.species] || r.species) + (r.name ? ' · ' + esc(r.name) : '') + '</div>' +
      (r.color ? '<div class="row"><strong>Χαρακτηριστικά:</strong> ' + esc(r.color) + '</div>' : '') +
      (r.description ? '<div class="row"><strong>Περιγραφή:</strong> ' + esc(r.description) + '</div>' : '') +
      '<div class="photos">' + photos + '</div>' +
      '<div class="muted">ID: ' + esc(r.id) + ' · ' + new Date(r.created_at).toLocaleString('el-GR') + '</div>' +
      (hidden
        ? '<div class="buttons">' +
            '<button class="approve" onclick="act(\'approve\')">✓ Είναι εντάξει – δημοσίευση</button>' +
            '<button class="reject" onclick="act(\'reject\')">✗ Να μείνει κρυφή</button>' +
          '</div>'
        : '') +
      '<div id="msg" class="msg"></div>';
  }

  function load() {
    if (!id || !sig) { box.textContent = 'Λείπουν στοιχεία από το link.'; return; }
    fetch(API + '?id=' + encodeURIComponent(id) + '&sig=' + encodeURIComponent(sig))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) render(d.report); else box.textContent = 'Σφάλμα: ' + (d.error || 'άγνωστο'); })
      .catch(function () { box.textContent = 'Δεν ήταν δυνατή η φόρτωση. Δοκίμασε ξανά.'; });
  }

  function act(action) {
    var text = action === 'approve'
      ? 'Η αναφορά θα δημοσιευτεί και ο κάτοχος θα ειδοποιηθεί. Συνέχεια;'
      : 'Η αναφορά θα παραμείνει κρυφή. Συνέχεια;';
    if (!confirm(text)) return;
    document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: id, sig: sig, action: action }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var msg = document.getElementById('msg');
        if (!d.ok) { msg.textContent = 'Σφάλμα: ' + (d.error || 'άγνωστο'); return; }
        msg.textContent = d.result === 'approved' ? '✓ Η αναφορά δημοσιεύτηκε.' : 'Η αναφορά παραμένει κρυφή.';
        if (d.result === 'approved') setTimeout(load, 800);
      })
      .catch(function () { document.getElementById('msg').textContent = 'Σφάλμα δικτύου. Δοκίμασε ξανά.'; });
  }

  load();
</script>
</body>
</html>
